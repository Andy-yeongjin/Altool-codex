.company-recipe :is(.list>li,.results>li) { padding-block:12px; border-block-end:1px solid var(--company-table-line); }
.company-recipe :is(.directory,.cards,.service-grid,.provider-list,.media-grid) { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:16px; }
.company-recipe .directory a { display:block; padding:16px; border-block-start:2px solid var(--company-section-accent); background:var(--company-section-body-bg); }
.company-recipe .directory strong { display:block; }
.company-recipe :is(.two-column,.feedback-layout) { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:24px; }
.company-recipe .feedback-layout[data-placement=bottom] { display:block; }
.company-recipe :is(.filter-layout,.search-layout.side) { display:grid; grid-template-columns:260px minmax(0,1fr); gap:24px; }
.company-recipe :is(.filters,.filter-fields,.form-grid,.range-fields) { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr)); gap:16px; }
.company-recipe .date-parts { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; }
.company-recipe .contents { grid-column:2; grid-row:1; position:sticky; top:16px; align-self:start; }
.company-recipe .detail-body { grid-column:1; grid-row:1; min-width:0; }
.company-recipe .detail-section { scroll-margin-top:16px; }
.company-recipe :is(.flow,.timeline,.infographic,.animation-stage) { display:flex; flex-wrap:wrap; gap:16px; padding:0; list-style-position:inside; }
.company-recipe :is(.flow li,.infographic>*,.animation-stage>*) { padding:12px; background:var(--company-section-body-bg); }
.company-recipe .animation-stage .current { border-block-start:3px solid var(--company-section-accent); }
.company-recipe .variant-panel { padding-block:16px; }
.company-recipe :is(.media-frame,.media-viewer) { padding:12px; overflow:auto; background:var(--company-section-body-bg); }
.company-recipe :is(.media-frame img,.media-frame video,.media-viewer video,.media-viewer img) { max-width:100%; max-height:400px; object-fit:contain; }
.company-recipe audio { width:100%; }
.company-recipe .file-icon, .company-recipe header img { width:16px; height:16px; vertical-align:middle; }
.company-recipe .tour-popover { position:fixed; inset:auto 20px 20px auto; z-index:10; max-width:min(340px,calc(100% - 40px)); padding:16px; border:1px solid var(--company-section-accent); border-radius:var(--company-button-radius); background:var(--krds24-gray-0); }
.company-recipe .tour-target { outline:2px solid var(--company-section-accent); outline-offset:3px; }
.company-recipe :is(.spinner,.busy-indicator) { display:inline-block; width:16px; height:16px; border:2px solid var(--company-section-accent); border-inline-end-color:transparent; border-radius:50%; animation:company-recipe-spin .8s linear infinite; }
.company-recipe progress { width:100%; accent-color:var(--company-section-accent); }
.company-recipe .ui-dialog { overflow:auto; }
.company-recipe .ui-dialog> :not(.ui-dialog-header,.ui-dialog-actions) { margin-inline:16px; }
.company-recipe .ui-dialog>h2 { margin:0; padding:12px 16px; background:var(--company-dialog-header-bg); color:var(--company-dialog-header-text); }
.company-recipe .ui-dialog>.actions { padding:12px 16px; margin:0; border-block-start:1px solid var(--company-dialog-line); }
.company-recipe .skip { position:absolute; inset-block-start:-100px; inset-inline-start:16px; }
.company-recipe .skip:focus { inset-block-start:8px; z-index:20; padding:12px; background:var(--krds24-gray-0); }
.company-recipe :is(.sr-only,.global-status:empty) { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.company-recipe .print-only { display:none; }
@keyframes company-recipe-spin { to { transform:rotate(360deg); } }
@media(max-width:700px) { .company-recipe :is(.two-column,.feedback-layout,.filter-layout,.search-layout.side) { display:flex; flex-direction:column; } .company-recipe .contents { position:static; order:0; } .company-recipe .detail-body { order:1; } .company-recipe .row>.field { flex-basis:100%; } .company-recipe :is(.actions,.pagination) { row-gap:12px; } }
@media(pointer:coarse) { .company-recipe .choice { min-height:44px; } }
@media(prefers-reduced-motion:reduce) { .company-recipe :is(.spinner,.busy-indicator) { animation:none; } }
@media print { .company-recipe :is(header,footer,nav,.actions,.sample-banner) { display:none; } .company-recipe .print-only { display:block; } .company-recipe main { max-width:none; padding:0; } }

const q=document.getElementById('q'),category=document.getElementById('category'),grid=document.getElementById('grid');let selected='search';
for(const c of [...new Set(data.map(x=>x.category))]){const o=document.createElement('option');o.value=c;o.textContent=c;category.append(o);}
function choose(id){selected=id;const x=data.find(i=>i.id===id);document.querySelector('#picked-icon use').setAttribute('href','#'+id);document.getElementById('picked-name').textContent=x.label_ko+' · '+id;document.getElementById('keywords').textContent=x.category+' / '+x.keywords.join(' · ');document.getElementById('snippet').value=x.usage_html;document.getElementById('copy-result').textContent='';grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));}
function render(){const term=q.value.trim().toLowerCase();const items=data.filter(x=>(category.value==='all'||x.category===category.value)&&[x.id,x.label_ko,x.category,...x.keywords].join(' ').toLowerCase().includes(term));grid.replaceChildren();for(const x of items){const b=document.createElement('button');b.type='button';b.className='tile';b.dataset.id=x.id;b.setAttribute('aria-pressed',String(x.id===selected));b.setAttribute('aria-label',x.label_ko+' '+x.id+' 선택');b.innerHTML='<svg class="ui-icon" aria-hidden="true"><use href="#'+x.id+'"></use></svg><span>'+x.label_ko+'</span><small>'+x.id+'</small>';b.addEventListener('click',()=>choose(x.id));grid.append(b);}document.getElementById('count').textContent=items.length+' / '+data.length+'개';document.getElementById('empty').hidden=items.length!==0;}
