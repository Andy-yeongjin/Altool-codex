<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">회사 업무 절차 예제</title><desc id="desc">정보 확인, 항목 선택, 완료의 세 단계. Altool이 v27 회사 색상과 직선 위계로 새로 작성한 설명용 도식이며 실제 업무 데이터가 아닙니다.</desc><rect width="640" height="360" fill="#FFFFFF"/><g fill="#F3F4F5"><rect x="32" y="120" width="176" height="112"/><rect x="232" y="120" width="176" height="112"/><rect x="432" y="120" width="176" height="112"/></g><g fill="#1554A0"><rect x="32" y="120" width="176" height="3"/><rect x="232" y="120" width="176" height="3"/><rect x="432" y="120" width="176" height="3"/></g><g font-family="Pretendard,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" font-weight="500" fill="#30363D"><text x="55" y="184">1. 정보 확인</text><text x="255" y="184">2. 항목 선택</text><text x="455" y="184">3. 참여 완료</text></g></svg>
