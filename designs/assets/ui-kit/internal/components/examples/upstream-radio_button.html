<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>01. 라디오 버튼(Radio button) · 회사 2024 테마</title><link rel="stylesheet" href="../../foundations/company-adapter.css"><link rel="stylesheet" href="../../upstream/resources/css/plugin/swiper-bundle.min.css"><script src="../../upstream/resources/js/plugin/swiper-bundle.min.js"></script><style>body{padding:1.5rem}.company-notice{padding:1rem;margin-bottom:1.5rem;background:var(--krds24-gray-5);border-left:4px solid var(--krds24-primary-60);font-size:.9375rem}</style></head><body><aside class="company-notice">샘플 데이터 · 공식 1.1.0 마크업 + Altool 회사 2024 테마. 실제 업무 처리는 연결하지 않았습니다. 정부 전용 표식은 정부기관에서만 사용합니다.</aside><!-- radio button -->
<div class="fieldset">
	<div class="form-group">
		<div class="form-conts">
			<div class="krds-check-area">
				<div class="krds-form-check">
					<input type="radio" name="rdo_1" id="rdo_1">
					<label for="rdo_1">기본</label>
				</div>
				<div class="krds-form-check">
					<input type="radio" name="rdo_1" id="rdo_2" checked>
					<label for="rdo_2">선택됨</label>
				</div>
				<div class="krds-form-check">
					<input type="radio" name="rdo_1" id="rdo_3" disabled>
					<label for="rdo_3">비활성화</label>
				</div>
				<div class="krds-form-check">
					<input type="radio" name="rdo_1a" id="rdo_4" disabled checked>
					<label for="rdo_4">선택된 비활성화</label>
				</div>
			</div>
		</div>
	</div>
	
	<div class="form-group">
		<div class="form-conts">
			<div class="krds-check-area chk-column">
				<div class="krds-form-check ">
					<input type="radio" name="rdo_1" id="rdo_1-1" checked>
					<label for="rdo_1-1">라디오버튼</label>
					<div class="krds-form-check-cnt">
						<p class="krds-form-check-p">
							부가적인 설명이 들어갑니다.
						</p>
					</div>
				</div>
				<div class="krds-form-check">
					<input type="radio" name="rdo_1" id="rdo_1-2">
					<label for="rdo_1-2">라디오버튼</label>
					<div class="krds-form-check-cnt">
						<p class="krds-form-check-p">
							부가적인 설명이 들어갑니다.
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
