<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>05. 모달(Modal) · 회사 2024 테마</title><link rel="stylesheet" href="../../foundations/company-adapter.css"><link rel="stylesheet" href="../../upstream/resources/css/plugin/swiper-bundle.min.css"><script src="../../upstream/resources/js/plugin/swiper-bundle.min.js"></script><style>body{padding:1.5rem}.company-notice{padding:1rem;margin-bottom:1.5rem;background:var(--krds24-gray-5);border-left:4px solid var(--krds24-primary-60);font-size:.9375rem}</style></head><body><aside class="company-notice">샘플 데이터 · 공식 1.1.0 마크업 + Altool 회사 2024 테마. 실제 업무 처리는 연결하지 않았습니다. 정부 전용 표식은 정부기관에서만 사용합니다.</aside><button type="button" class="krds-btn large open-modal" data-target="modal_sample_01">class 및 data-target 호출</button>
<!-- modal -->
<section id="modal_sample_01" class="krds-modal fade in shown" role="dialog" aria-labelledby="tit_modal_sample_01">
	<div class="modal-dialog">
		<div class="modal-content">
			<!-- modal title -->
			<div class="modal-header">
				<h2 id="tit_modal_sample_01" class="modal-title">
					모달 제목
				</h2>
			</div>
			<!-- //modal title -->
			<!-- modal contents -->
			<div class="modal-conts">
				<div class="conts-area">
					대화 상자는 사용자에게 작업에 대해 알리고 중요한 정보를 포함하거나 결정이 필요하거나 여러 작업을 포함할 수 있습니다.
				</div>
			</div>
			<!-- //modal contents -->
			<!-- modal btn -->
			<div class="modal-btn btn-wrap">
				<button type="button" class="krds-btn medium tertiary close-modal">아니요</button>
				<button type="button" class="krds-btn medium primary close-modal">예</button>
			</div>
			<!-- //modal btn -->
			<!-- close button -->
			<button type="button" class="krds-btn medium icon btn-close close-modal">
				<span class="sr-only">닫기</span>
				<i class="svg-icon ico-popup-close"></i>
			</button>
			<!-- //close button -->
		</div>
	</div>
	<div class="modal-back in"></div>
</section>
<!-- //modal --><script src="../../upstream/resources/js/component/ui-script.js"></script></body></html>
