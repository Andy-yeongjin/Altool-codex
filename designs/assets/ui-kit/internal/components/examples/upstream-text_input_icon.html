<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>03. 텍스트 입력 필드(Text input) · 회사 2024 테마</title><link rel="stylesheet" href="../../foundations/company-adapter.css"><link rel="stylesheet" href="../../upstream/resources/css/plugin/swiper-bundle.min.css"><script src="../../upstream/resources/js/plugin/swiper-bundle.min.js"></script><style>body{padding:1.5rem}.company-notice{padding:1rem;margin-bottom:1.5rem;background:var(--krds24-gray-5);border-left:4px solid var(--krds24-primary-60);font-size:.9375rem}</style></head><body><aside class="company-notice">샘플 데이터 · 공식 1.1.0 마크업 + Altool 회사 2024 테마. 실제 업무 처리는 연결하지 않았습니다. 정부 전용 표식은 정부기관에서만 사용합니다.</aside><!-- text input -->
<div class="fieldset">
	<!-- 폼그룹 -->
	<div class="form-group">
		<div class="form-tit">
			<label for="login_pw">레이블</label>
		</div>
		<div class="form-conts btn-ico-wrap">
			<input type="password" id="login_pw" class="krds-input" placeholder="8-12자의 영문자, 숫자, 특수문자 조합" value="1234567890">
			<button type="button" class="krds-btn medium icon">
				<span class="sr-only">입력한 비밀번호 보기</span>
				<i class="svg-icon ico-pw-visible"></i>
			</button>
		</div>
	</div>
	<!-- //폼그룹 -->
	<!-- 폼그룹 -->
	<div class="form-group">
		<div class="form-tit">
			<label for="login_pw2">레이블</label>
		</div>
		<div class="form-conts btn-ico-wrap">
			<input type="text" id="login_pw2" class="krds-input" placeholder="8-12자의 영문자, 숫자, 특수문자 조합" value="1234567890">
			<button type="button" class="krds-btn medium icon">
				<span class="sr-only">입력한 비밀번호 가리기</span>
				<i class="svg-icon ico-pw-visible-on"></i>
			</button>
		</div>
	</div>
	<!-- //폼그룹 -->
	<!-- 폼그룹 -->
	<div class="form-group">
		<div class="form-tit">
			<label for="form_delete">레이블</label>
		</div>
		<div class="form-conts btn-ico-wrap" data-delete="true">
			<input type="text" id="form_delete" class="krds-input" placeholder="내용을 입력하세요">
			<button type="button" class="krds-btn medium icon pure btn-delete-input">
				<span class="sr-only">내용 삭제</span>
				<i class="svg-icon ico-delete-fill"></i>
			</button>
		</div>
	</div>
	<!-- //폼그룹 -->
	<!-- 폼그룹 -->
	<div class="form-group">
		<div class="form-tit">
			<label for="form_btn_multiple">레이블</label>
		</div>
		<div class="form-conts btn-ico-wrap" data-delete="true">
			<input type="password" id="form_btn_multiple" class="krds-input" placeholder="8-12자의 영문자, 숫자, 특수문자 조합" value="1234567890">
			<div class="btn-group">
				<button type="button" class="krds-btn medium icon pure btn-delete-input">
					<span class="sr-only">내용 삭제</span>
					<i class="svg-icon ico-delete-fill"></i>
				</button>
				<button type="button" class="krds-btn medium icon">
					<span class="sr-only">입력한 비밀번호 보기</span>
					<i class="svg-icon ico-pw-visible"></i>
				</button>
			</div>
		</div>
	</div>
	<!-- //폼그룹 -->
</div>
<!-- //text input --><script src="../../upstream/resources/js/component/ui-script.js"></script></body></html>
