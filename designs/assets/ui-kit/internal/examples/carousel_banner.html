<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>carousel_banner · KRDS 참고 예제</title>
<link rel="stylesheet" href="../upstream/resources/css/component/output.css">
<link rel="stylesheet" href="../upstream/resources/css/common/common.css">
<link rel="stylesheet" href="../upstream/resources/css/plugin/swiper-bundle.min.css">
<script src="../upstream/resources/js/plugin/swiper-bundle.min.js"></script>
<style>body{padding:24px}.altool-demo-notice{display:block;background:#fff3cd;color:#473500;padding:12px;font:14px/1.6 system-ui;margin-bottom:24px}:focus-visible{outline:3px solid #005fcc;outline-offset:3px}</style>
</head><body><aside class="altool-demo-notice">KRDS 공식 키트 1.1.0 참고 예제 · 실제 정부 서비스가 아닙니다. 로그인·신청·저장 등의 서버 동작은 연결하지 않았습니다. 2024 PDF와의 개별 준수 검증은 별도입니다.</aside>
<!-- carousel -->
<!--
 	해당 컴포넌트 사용 시 페이지에
 	/resources/css/plugin/swiper-bundle.min.css
 	/resources/js/plugin/swiper-bundle.min.js
 	를 추가 필요
 -->
<div class="main-sect">
    <div class="inner">
        <div class="main-box-responsive type-wrap">
            <div class="d-fix">
                <div class="main-tit-wrap">
                    <h2 class="tit">배너영역 타이틀</h2>
                </div>

                <div class="in">
                    <div class="main-d-ban-swiper">
                        <div class="swiper">
                            <ul class="swiper-wrapper">
                                <li class="swiper-slide">
                                    <div class="text">
                                        <p class="cate">서브타이틀</p>
                                        <p class="tit">타이틀</p>
                                    </div>
                                    <div class="im">
                                        <svg width="243" height="178" viewBox="0 0 243 178" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="예시">
                                            <rect width="243" height="178" fill="#E6E8EA" />
                                        </svg>
                                    </div>
                                </li>
                                <li class="swiper-slide">
                                    <div class="text">
                                        <p class="cate">서브타이틀</p>
                                        <p class="tit">타이틀</p>
                                    </div>
                                    <div class="im">
										<svg width="243" height="178" viewBox="0 0 243 178" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="예시">
											<rect width="243" height="178" fill="#E6E8EA"/>
										</svg>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <div class="swiper-indicator">
                            <div class="swiper-pagination"></div>
                            <div class="swiper-controller">
                                <button type="button" class="swiper-button-play">
                                    <span class="sr-only">슬라이드 재생</span>
                                </button>
                                <button type="button" class="swiper-button-stop">
                                    <span class="sr-only">슬라이드 멈춤</span>
                                </button>
                            </div>
                            <div class="swiper-navigation">
                                <button type="button" class="swiper-button-prev">
                                    <span class="sr-only">이전</span>
                                </button>
                                <button type="button" class="swiper-button-next">
                                    <span class="sr-only">다음</span>
                                </button>
                                <a href="#" class="swiper-button-more">
                                    <span class="sr-only">더 보기</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- //carousel -->

<script>
    const eleBanSwiper = new Swiper(".main-d-ban-swiper .swiper", {
        slidesPerView: 1,
        spaceBetween: 16,
        speed: 400,
        loop: true,
        autoplay: {
            delay: 2500,
            disableOnInteraction: false,
            pauseOnMouseEnter: true,
        },
        navigation: {
            nextEl: ".main-d-ban-swiper .swiper-button-next",
            prevEl: ".main-d-ban-swiper .swiper-button-prev",
        },
        pagination: {
            el: ".main-d-ban-swiper .swiper-pagination",
            type: "fraction",
        },
    });
    const $eleBanSwiperPlay = document.querySelector(".main-d-ban-swiper .swiper-button-play");
    const $eleBanSwiperStop = document.querySelector(".main-d-ban-swiper .swiper-button-stop");

    $eleBanSwiperPlay.style.display = "none";

    $eleBanSwiperPlay.addEventListener("click", () => {
        eleBanSwiper.autoplay.start();
        $eleBanSwiperStop.style.display = "";
        $eleBanSwiperPlay.style.display = "none";
    });

    $eleBanSwiperStop.addEventListener("click", () => {
        eleBanSwiper.autoplay.stop();
        $eleBanSwiperStop.style.display = "none";
        $eleBanSwiperPlay.style.display = "";
    });
</script>

<script src="../upstream/resources/js/component/ui-script.js"></script>
</body></html>
