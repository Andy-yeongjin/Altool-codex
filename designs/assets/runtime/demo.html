<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두 앱, 하나의 공통 자산 · Altool</title><link rel="stylesheet" href="../preview.css"><link rel="stylesheet" href="demo.css"><script src="demo.mjs" type="module"></script></head>
<body><header><a href="../index.html">공통 자산으로 돌아가기</a></header><main><h1>두 앱, 하나의 기준.</h1><p>구매 관리와 인사 관리가 각각 같은 ID를 요청합니다. 아이콘과 오류 문구를 앱별로 정의하지 않습니다. 실제 업무 서버에 연결하지 않는 사용 검증 화면입니다.</p><p id="release" role="status">회사 팩 확인 중…</p><p id="failure" role="alert" hidden></p>
<div class="app-grid"><article data-app="purchase" aria-label="구매 관리 앱"><h2>구매 관리 앱</h2><button type="button" data-settings disabled>설정</button><p><button type="button" data-error disabled>네트워크 오류 상태 표시</button> <button type="button" data-clear>오류 표시 지우기</button></p><div data-message></div></article>
<article data-app="people" aria-label="인사 관리 앱"><h2>인사 관리 앱</h2><button type="button" data-settings disabled>설정</button><p><button type="button" data-error disabled>네트워크 오류 상태 표시</button> <button type="button" data-clear>오류 표시 지우기</button></p><div data-message></div></article></div>
<section><h2>임의 변형 차단</h2><p>설정 아이콘의 미등록 ‘triangle’ 변형을 요청하면 실패해야 합니다.</p><button id="invalid" type="button" disabled>미등록 변형 검사</button><p id="guard-result" role="status"></p></section>
<dialog id="settings" aria-labelledby="settings-title"><h2 id="settings-title">공통 설정 진입</h2><p>어느 앱이든 같은 설정 아이콘을 사용합니다. 실제 설정 항목은 업무 요구에 맞게 구성합니다.</p><button id="close" type="button">닫기</button></dialog></main></body></html>
